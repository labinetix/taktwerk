[package]
name = "taktwerk-raw"
description = "Raw C library model adapter for taktwerk: header import, descriptors, C layout"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
taktwerk-core.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
libloading = "0.8"
tempfile = "3"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
taktwerk-fmi.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
