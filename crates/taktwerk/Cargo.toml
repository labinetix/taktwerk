[package]
name = "taktwerk"
description = "Fixed-step model execution engine for Linux with its own OPC UA server"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "taktwerk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-opcua = { version = "0.19", default-features = false, features = ["client"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde.workspace = true
taktwerk-core.workspace = true
taktwerk-raw.workspace = true
taktwerk-fmi.workspace = true
taktwerk-opcua.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
