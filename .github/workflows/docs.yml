# Builds the user and developer guide (docs/) with a pinned mdBook and deploys it to GitHub
# Pages at https://labinetix.github.io/taktwerk/.

name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook (pinned)
        env:
          MDBOOK_VERSION: "0.5.4"
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          set -euo pipefail
          name="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$name"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build docs

      - name: Forbidden-name check
        run: |
          if grep -rniE -f docs/forbidden-names docs/book; then
            echo "a forbidden name is on the site (docs/forbidden-names)" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
